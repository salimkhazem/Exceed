[project]
name = "exceed"
version = "0.1.0"
description = "False discovery control for anomaly segmentation from nominal images only (compound e-values under image exchangeability)"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
